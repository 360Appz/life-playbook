<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Brutal Playbook - Interactive Playbook Viewer">
  <title>The Brutal Playbook - Explore</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Header Navigation -->
  <header>
    <div class="header-content">
      <a href="../index.html" class="logo"><span class="logo-long">⚔️ BRUTAL PLAYBOOK</span><span class="logo-short">⚔️ BP</span></a>
      <nav id="main-nav">
        <a href="../index.html">Home</a>
        <a href="#phases">Phases</a>
        <a href="#quick-nav">Jump</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </header>

  <!-- Playbook Selector -->
  <section class="container mt-lg mb-lg">
    <div class="grid grid-3" id="playbook-selector">
      <!-- Dynamically populated -->
    </div>
  </section>

  <!-- Active Playbook Display -->
  <section class="container mt-lg mb-xl" id="playbook-content">
    <!-- Header -->
    <div id="playbook-header" class="card card-primary animate-slide-up mb-lg">
      <h1 id="playbook-title" style="color: white; margin-top: 0;"></h1>
      <p id="playbook-subtitle" style="color: rgba(255,255,255,0.95); font-size: 1.1rem; margin: 0;"></p>
    </div>

    <!-- Quick Navigation - Phase Selector -->
    <div class="mb-lg">
      <h3 class="mb-md">📚 Phases/Chapters</h3>
      <div class="flex gap-sm" id="quick-nav" style="overflow-x: auto; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch;">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- Main Carousel for Phases/Chapters -->
    <div class="carousel mb-xl">
      <div class="carousel-inner" id="phases-carousel" style="min-height: 600px;">
        <!-- Dynamically populated -->
      </div>
      <div class="carousel-nav">
        <button class="carousel-btn" onclick="scrollPhasesCarousel(-1)">←</button>
        <button class="carousel-btn" onclick="scrollPhasesCarousel(1)">→</button>
      </div>
    </div>

    <!-- Progress Indicator -->
    <div class="card" style="text-align: center;">
      <p style="margin: 0; color: var(--text-secondary);">
        <span id="phase-counter">1</span> / <span id="phase-total">1</span> phases
        <div class="progress-bar" style="margin: 1rem 0;">
          <div class="progress-bar-fill" id="phase-progress" style="width: 0%;"></div>
        </div>
      </p>
    </div>
  </section>

  <!-- Footer -->
  <footer style="background: var(--bg-secondary); padding: 2rem; text-align: center; margin-top: 4rem; border-top: 2px solid var(--border-light);">
    <p style="color: var(--text-secondary); margin: 0;">
      The Brutal Playbook™ | Explore, Learn, Transform<br>
      <small>Interactive • Responsive • Gamified</small>
    </p>
  </footer>

  <!-- Modal for Section Content -->
  <div class="modal-overlay" id="section-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Section Title</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-content" id="modal-body">
        <!-- Content will be injected here -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/content-data.js"></script>
  <script>
    let currentPlaybook = null;
    let currentPhaseIndex = 0;
    let totalPhases = 0;

    // Get URL parameters
    function getUrlParameter(param) {
      const params = new URLSearchParams(window.location.search);
      return params.get(param) || 'original';
    }

    // Initialize page
    function initializePage() {
      const version = getUrlParameter('version');
      loadPlaybook(version);
      loadPlaybookSelector();
    }

    function loadPlaybookSelector() {
      const selector = document.getElementById('playbook-selector');
      const playbooks = [
        { key: 'original', data: contentData.playbooks.original, emoji: '🔥' },
        { key: 'christCentered', data: contentData.playbooks.christCentered, emoji: '✨' },
        { key: 'missingChapters', data: contentData.playbooks.missingChapters, emoji: '🌙' }
      ];

      selector.innerHTML = playbooks.map(pb => `
        <div class="card" style="cursor: pointer; transition: var(--transition-base);" onclick="loadPlaybook('${pb.key}')">
          <div style="text-align: center;">
            <div style="font-size: 2.5rem; margin-bottom: 1rem;">${pb.emoji}</div>
            <h3 style="margin-top: 0;">${pb.data.title}</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0;">${pb.data.subtitle.substring(0, 80)}...</p>
          </div>
        </div>
      `).join('');
    }

    function loadPlaybook(version) {
      const version_map = {
        'original': 'original',
        'christCentered': 'christCentered',
        'missingChapters': 'missingChapters'
      };

      const playbook_key = version_map[version] || 'original';
      currentPlaybook = contentData.playbooks[playbook_key];
      currentPhaseIndex = 0;

      // Update header
      const header = document.getElementById('playbook-header');
      header.style.background = currentPlaybook.color ? `linear-gradient(135deg, ${currentPlaybook.color}, ${adjustColor(currentPlaybook.color)})` : 'var(--primary-gradient)';
      document.getElementById('playbook-title').textContent = currentPlaybook.title;
      document.getElementById('playbook-subtitle').textContent = currentPlaybook.subtitle;

      // Load phases/chapters into carousel
      loadPhasesCarousel();
      loadQuickNav();
      updatePhaseIndicator();
    }

    function adjustColor(color) {
      return color + '80';
    }

    function loadPhasesCarousel() {
      const phases = currentPlaybook.phases || currentPlaybook.chapters || [];
      totalPhases = phases.length;

      const carousel = document.getElementById('phases-carousel');
      carousel.innerHTML = phases.map((phase, phaseIndex) => {
        const sectionCount = (phase.sections || []).length;

        return `
        <div class="carousel-item card animate-slide-up" style="min-height: 600px; display: flex; flex-direction: column;">
          <div style="flex: 1; display: flex; flex-direction: column;">
            <h2 style="margin-top: 0; margin-bottom: 0.5rem; color: var(--text-primary);">
              ${phase.title}
            </h2>
            <p class="text-secondary mb-lg" style="margin-top: 0; font-size: 0.95rem;">${phase.subtitle}</p>

            <!-- Nested Carousel for Section Cards -->
            <div style="flex: 1; display: flex; flex-direction: column; position: relative; gap: var(--spacing-md);">
              <div class="carousel-inner" id="nested-carousel-${phaseIndex}" style="flex: 1; display: flex; gap: var(--spacing-lg); overflow-x: auto; scroll-behavior: smooth; padding: var(--spacing-lg);">
                ${(phase.sections || []).map((section, sIdx) => {
                  return `
                    <div class="section-card card" onclick="openModal('${phaseIndex}', '${sIdx}')" style="flex: 0 0 100%; height: 420px; cursor: pointer; position: relative; display: flex; flex-direction: column; padding: var(--spacing-lg);">
                      <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column;">
                        <h3 style="margin: 0 0 1rem 0; color: var(--text-accent); font-size: var(--font-size-lg); line-height: 1.3; flex-shrink: 0;">
                          ${section.heading}
                        </h3>
                        <p style="white-space: pre-wrap; line-height: 1.6; margin: 0; color: var(--text-primary); font-size: 0.95rem; overflow-y: auto; flex: 1;">
                          ${section.content}
                        </p>
                      </div>
                      <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(0,0,0,0.1); font-size: 0.85rem; color: var(--text-accent); font-weight: 600; flex-shrink: 0;">
                        Click to expand ↗
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Nested Carousel Navigation -->
              <div style="display: flex; gap: var(--spacing-md); justify-content: center; align-items: center; padding: var(--spacing-md) 0; border-top: 2px solid var(--border-light); flex-shrink: 0;">
                <button class="carousel-btn" onclick="scrollNestedCarousel(${phaseIndex}, -1)" style="width: 44px; height: 44px; font-size: 1rem; min-width: 44px;">←</button>
                <span style="flex: 1; text-align: center; color: var(--text-secondary); font-size: 0.875rem; white-space: nowrap;">
                  Card <span class="nested-counter-${phaseIndex}">1</span> / <span class="nested-total-${phaseIndex}">${sectionCount}</span>
                </span>
                <button class="carousel-btn" onclick="scrollNestedCarousel(${phaseIndex}, 1)" style="width: 44px; height: 44px; font-size: 1rem; min-width: 44px;">→</button>
              </div>
            </div>
          </div>
        </div>
      `;
      }).join('');

      // Update phase total
      document.getElementById('phase-total').textContent = totalPhases;
      
      // Initialize nested carousel indices and buttons
      phases.forEach((phase, idx) => {
        window[`nestedIndex_${idx}`] = 0;
      });

      // Initialize button states after DOM renders
      setTimeout(() => {
        initializeNestedCarouselButtons();
      }, 100);
    }

    function loadQuickNav() {
      const nav = document.getElementById('quick-nav');
      const phases = currentPlaybook.phases || currentPlaybook.chapters || [];

      nav.innerHTML = phases.map((phase, index) => `
        <button 
          class="btn ${index === currentPhaseIndex ? 'btn-primary' : 'btn-outline'}" 
          onclick="goToPhase(${index})"
          style="white-space: nowrap; flex-shrink: 0;"
        >
          ${phase.title.substring(0, 20)}
        </button>
      `).join('');
    }

    function updatePhaseIndicator() {
      document.getElementById('phase-counter').textContent = currentPhaseIndex + 1;
      const progress = ((currentPhaseIndex + 1) / totalPhases) * 100;
      document.getElementById('phase-progress').style.width = progress + '%';
      loadQuickNav();
    }

    function scrollPhasesCarousel(direction) {
      const carousel = document.getElementById('phases-carousel');
      const scrollAmount = carousel.parentElement.offsetWidth;
      currentPhaseIndex = Math.max(0, Math.min(totalPhases - 1, currentPhaseIndex + direction));
      carousel.scrollBy({
        left: direction * scrollAmount,
        behavior: 'smooth'
      });
      updatePhaseIndicator();
    }

    function goToPhase(index) {
      currentPhaseIndex = index;
      const carousel = document.getElementById('phases-carousel');
      const item = carousel.children[index];
      if (item) {
        item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
      }
      updatePhaseIndicator();
    }

    function scrollNestedCarousel(phaseIndex, direction) {
      const nestedCarousel = document.getElementById(`nested-carousel-${phaseIndex}`);
      if (!nestedCarousel) return;

      const cardWidth = nestedCarousel.children[0]?.offsetWidth || 0;
      if (cardWidth === 0) return;

      const totalCards = nestedCarousel.children.length;
      let currentIndex = window[`nestedIndex_${phaseIndex}`] || 0;
      const nextIndex = currentIndex + direction;

      // Don't navigate past the limits (no wrapping)
      if (nextIndex < 0 || nextIndex >= totalCards) {
        return; // Stop at boundaries - no navigation
      }

      // Update index
      currentIndex = nextIndex;
      window[`nestedIndex_${phaseIndex}`] = currentIndex;

      // Scroll to new card
      const scrollTo = currentIndex * (cardWidth + 24); // 24px is gap
      nestedCarousel.scroll({
        left: scrollTo,
        behavior: 'smooth'
      });

      // Update counter
      const counter = document.querySelector(`.nested-counter-${phaseIndex}`);
      if (counter) {
        counter.textContent = currentIndex + 1;
      }

      // Update button states (disable at boundaries)
      updateNestedCarouselButtons(phaseIndex, currentIndex, totalCards);

      // Play sound
      playSound(523.25, 0.05);
    }

    function updateNestedCarouselButtons(phaseIndex, currentIndex, totalCards) {
      // Find the navigation buttons for this phase
      const buttons = document.querySelectorAll(`button[onclick*="scrollNestedCarousel(${phaseIndex}"]`);
      
      if (buttons.length >= 2) {
        const prevBtn = buttons[0]; // Left button
        const nextBtn = buttons[1]; // Right button

        // Disable/Enable buttons based on position
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === totalCards - 1;

        // Visual styling for disabled state
        if (currentIndex === 0) {
          prevBtn.style.opacity = '0.5';
          prevBtn.style.cursor = 'not-allowed';
        } else {
          prevBtn.style.opacity = '1';
          prevBtn.style.cursor = 'pointer';
        }

        if (currentIndex === totalCards - 1) {
          nextBtn.style.opacity = '0.5';
          nextBtn.style.cursor = 'not-allowed';
        } else {
          nextBtn.style.opacity = '1';
          nextBtn.style.cursor = 'pointer';
        }
      }
    }

    // Initialize button states when phase loads
    function initializeNestedCarouselButtons() {
      const phases = currentPlaybook.phases || currentPlaybook.chapters || [];
      phases.forEach((phase, phaseIndex) => {
        const totalCards = (phase.sections || []).length;
        window[`nestedIndex_${phaseIndex}`] = 0;
        updateNestedCarouselButtons(phaseIndex, 0, totalCards);
      });
    }
    function openModal(phaseIndex, sectionIndex) {
      const phases = currentPlaybook.phases || currentPlaybook.chapters || [];
      const phase = phases[phaseIndex];
      const section = phase.sections[sectionIndex];

      if (!section) return;

      // Set modal content
      document.getElementById('modal-title').textContent = section.heading;
      document.getElementById('modal-body').innerHTML = `
        <p style="white-space: pre-wrap; line-height: 1.8; margin: 0;">
          ${section.content}
        </p>
      `;

      // Show modal
      const modal = document.getElementById('section-modal');
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';

      // Play sound
      playSound(659.25, 0.05);
    }

    function closeModal() {
      const modal = document.getElementById('section-modal');
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
      playSound(523.25, 0.05);
    }

    // Close modal when clicking outside
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('section-modal');
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeModal();
        }
      });

      // Close modal with Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeModal();
        }
      });
    });

    // Sound effects
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(frequency = 440, duration = 0.1) {
      try {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = frequency;
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration);
      } catch (e) {
        // Audio context may not be available
      }
    }

    // Play sound on button clicks
    document.addEventListener('DOMContentLoaded', () => {
      initializePage();
      const buttons = document.querySelectorAll('.btn, .carousel-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => playSound(523.25, 0.05));
      });
    });
  </script>
  <script>
    (function() {
      const hamburger = document.getElementById('hamburger');
      const nav = document.getElementById('main-nav');
      hamburger.addEventListener('click', function() {
        const open = nav.classList.toggle('nav-open');
        hamburger.classList.toggle('is-active', open);
        hamburger.setAttribute('aria-expanded', open);
      });
      document.addEventListener('click', function(e) {
        if (!hamburger.contains(e.target) && !nav.contains(e.target)) {
          nav.classList.remove('nav-open');
          hamburger.classList.remove('is-active');
          hamburger.setAttribute('aria-expanded', 'false');
        }
      });
      nav.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', function() {
          nav.classList.remove('nav-open');
          hamburger.classList.remove('is-active');
          hamburger.setAttribute('aria-expanded', 'false');
        });
      });
    })();
  </script>
</body>
</html>
